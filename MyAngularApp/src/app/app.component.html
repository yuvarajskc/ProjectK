
<router-outlet />
<h3>{{ title }}</h3>
<table style="width:100%; border-collapse: collapse;">
    <thead>
        <tr style="background-color: #f2f2f2;">
            <th style="border: 1px solid black; padding: 8px; text-align: left; background-color: #4CAF50; color: white;">Name</th>
            <th style="border: 1px solid black; padding: 8px; text-align: left; background-color: #4CAF50; color: white;">Is Complete</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let item of todoList" style="background-color: #f9f9f9;">
            <td style="border: 1px solid black; padding: 8px;">{{ item.name }}</td>
            <td style="border: 1px solid black; padding: 8px;">{{ item.isComplete ? 'Yes' : 'No' }}</td>
        </tr>
    </tbody>
</table>
